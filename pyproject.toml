[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "jet-music-player"
version = "0.1.0"
description = "Jet Music Player — an ASCII terminal music player with a live visualizer, built on Textual."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Ryan Trevors" }]
keywords = ["music", "player", "terminal", "tui", "textual", "visualizer", "ascii"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Sound/Audio :: Players",
]
dependencies = [
    "textual>=0.60.0",
    "pygame>=2.5.0",
    "mutagen>=1.47.0",
    "numpy>=1.24.0",
    "pydub>=0.25.1",
]

[project.scripts]
jmp = "jet_music_player.cli:main"

[tool.setuptools]
packages = ["jet_music_player"]

[tool.setuptools.package-data]
jet_music_player = ["*.tcss"]
